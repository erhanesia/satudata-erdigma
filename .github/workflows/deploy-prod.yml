# Deploy produksi satudata-web ke box satudata-prod (satudata.powerhouze.id).
#
# Tanpa kredensial AWS statis: OIDC GitHub → role `gh-actions-satudata-web-deploy`.
# Nama branch ikut terpatri di trust policy role itu
# (`repo:erhanesia/satudata-erdigma:ref:refs/heads/main`) — mengganti nama
# branch berarti memperbarui dua tempat sekaligus.
name: Deploy produksi

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: satudata-web-deploy-prod
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-1
  ECR_REPOSITORY: satudata-web
  # Box tujuan dicari lewat tag PENANDA, bukan tag Name.
  #
  # Alasannya: satudata untuk sementara menumpang di box career-prod sementara
  # kuota vCPU akun belum naik. Dengan penanda ini, pemindahan ke box t4g
  # sendiri nanti cukup memindahkan tag-nya — workflow ini, dan kondisi IAM
  # yang menjaganya, tidak perlu disentuh sama sekali.
  INSTANCE_TAG_KEY: SatudataHost
  INSTANCE_TAG_VALUE: 'yes'

jobs:
  periksa:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      # `npm run build` di tahap image sudah menjalankan `tsc -b`, tapi di sana
      # kegagalannya tercampur dengan galat bundling. Dijalankan terpisah di
      # sini supaya galat tipe muncul sebagai kegagalan tersendiri.
      - run: npm run typecheck

  deploy:
    name: Build, push, deploy
    needs: periksa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag pendek dari commit
        id: meta
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::359475667317:role/gh-actions-satudata-web-deploy
          aws-region: ap-southeast-1

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build & push image arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ steps.ecr.outputs.registry }}/satudata-web:prod
            ${{ steps.ecr.outputs.registry }}/satudata-web:prod-${{ steps.meta.outputs.sha }}
          build-args: |
            VITE_COGNITO_DOMAIN=${{ vars.VITE_COGNITO_DOMAIN }}
            VITE_COGNITO_CLIENT_ID=${{ vars.VITE_COGNITO_CLIENT_ID }}
            VITE_API_BASE_URL=
            VITE_COGNITO_REDIRECT_URI=
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy lewat SSM
        run: |
          set -euo pipefail
          CMD=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --document-name AWS-RunShellScript \
            --targets "Key=tag:${INSTANCE_TAG_KEY},Values=${INSTANCE_TAG_VALUE}" \
            --comment "deploy satudata-web ${{ steps.meta.outputs.sha }}" \
            --timeout-seconds 900 \
            --parameters 'commands=["/usr/local/bin/satudata-deploy.sh satudata-web"]' \
            --query 'Command.CommandId' --output text)
          echo "CommandId=$CMD"

          STATUS=Pending
          for _ in $(seq 1 120); do
            sleep 5
            STATUS=$(aws ssm list-command-invocations --region "$AWS_REGION" \
              --command-id "$CMD" --query 'CommandInvocations[0].Status' --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
          done

          echo "--- keluaran box ---"
          aws ssm list-command-invocations --region "$AWS_REGION" --command-id "$CMD" --details \
            --query 'CommandInvocations[0].CommandPlugins[0].Output' --output text || true

          echo "Status akhir: $STATUS"
          [ "$STATUS" = "Success" ]
