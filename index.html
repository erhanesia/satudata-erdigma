<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />

    <!-- Ikon tab peramban. Dirujuk langsung dari src/, bukan disalin ke public/,
         supaya hanya ada SATU berkas logo yang dijaga: header, footer, dan
         halaman masuk memakai berkas yang sama ini. Vite memprosesnya saat build
         dan menambahkan hash pada namanya, jadi peramban tidak menahan versi
         lama setelah logonya diganti.

         Yang dipakai varian "mark", bukan logo penuh. Logo penuh berukuran
         1772x1772 dan berisi tulisan yang tidak akan terbaca pada kotak 16px. -->
    <link rel="icon" type="image/png" href="/src/shared/assets/logo-erdigma-mark.png" />

    <!-- Portal internal: jangan sampai terindeks mesin pencari. -->
    <meta name="robots" content="noindex, nofollow" />
    <!-- Jangan bocorkan path halaman internal ke situs luar lewat header Referer. -->
    <meta name="referrer" content="same-origin" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <title>Satu Data Erdigma</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
