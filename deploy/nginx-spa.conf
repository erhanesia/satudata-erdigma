# Konfigurasi nginx DI DALAM container satudata-web. Ia hanya menyajikan berkas
# statis hasil `vite build`; TLS, pengalihan, dan proxy ke API ditangani nginx
# terdepan di box (lihat /opt/satudata/nginx/conf.d/ di satudata-prod).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite menamai berkas di /assets/ dengan hash isi, jadi nama berubah setiap
    # kali isinya berubah — aman di-cache selamanya.
    # Satu baris Cache-Control saja. `expires` DAN `add_header Cache-Control`
    # bersamaan menghasilkan DUA header Cache-Control di jawaban yang sama --
    # sah menurut HTTP tapi tidak ada gunanya, dan menyulitkan siapa pun yang
    # kelak menelusuri masalah cache.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html TIDAK boleh ikut di-cache. Namanya tetap sama di setiap rilis,
    # jadi peramban yang menyimpannya akan terus memuat bundle lama sementara
    # berkas /assets/ yang dirujuknya sudah dihapus deploy berikutnya — layar
    # putih tanpa galat yang jelas.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Routing dilakukan di sisi klien (react-router). Tanpa fallback ini,
    # memuat ulang halaman di /dataset/123 meminta berkas yang tidak ada dan
    # nginx menjawab 404 — padahal aplikasinya baik-baik saja.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
